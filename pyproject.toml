[project]
name = "shunt-melspec-v2"
version = "0.1.0"
description = "Mel-spectrogram parameter optimization for shunt sound classification"
requires-python = ">=3.10,<3.13"

dependencies = [
    # コア
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # 音声処理
    "librosa>=0.10.1",
    "soundfile>=0.12",
    # 画像処理
    "opencv-python>=4.8",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # 深層学習
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    "timm>=1.0.0",
    # Grad-CAM
    "grad-cam>=1.5.0",
    # 統計解析
    "statsmodels>=0.14",
    "pingouin>=0.5.4",
    # I/O とユーティリティ
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    # オプション（推奨）
    "tensorboard>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

# PyTorch CUDA 12.8 index (RTX 5060 Blackwell対応, CUDA 12.8+必須)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
